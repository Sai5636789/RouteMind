# RouteMind API configuration.
# Every environment-specific value comes from the environment (or .env via
# docker compose). The defaults are local-development values only.
server:
  port: ${PORT:8080}

spring:
  application:
    name: routemind
  datasource:
    # gssEncMode=disable: this app authenticates with a password, not Kerberos.
    # GSSAPI-enabled servers answer 'G' to the driver's GSS probe, and without
    # Kerberos credentials the handshake fails and breaks the connection.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/routemind?gssEncMode=disable}
    username: ${DATABASE_USERNAME:routemind}
    password: ${DATABASE_PASSWORD:routemind_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mvc:
    # Unmapped API paths throw instead of falling through to the default
    # error page, so GlobalExceptionHandler controls the error shape.
    throw-exception-if-no-handler-found: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

routemind:
  auth:
    # JWT signing secret. Anyone holding it can forge tokens, so change it
    # in every non-local environment via JWT_SECRET (see .env.example).
    # Must be at least 32 characters; the app refuses to start with a
    # shorter one and logs a warning while the default below is in use.
    # The default is a local-development value only.
    jwt-secret: ${JWT_SECRET:routemind-dev-secret-change-me-before-any-shared-deployment-0123456789}
    # How long a login token stays valid.
    token-ttl: ${JWT_TOKEN_TTL:8h}
    # The single seeded dispatcher account. There is no user management:
    # one dispatcher signs in to the dashboard, and that is the whole
    # account model. Change the password via DISPATCHER_PASSWORD; the
    # default below is a local-development value only (see README,
    # Authentication).
    dispatcher-username: ${DISPATCHER_USERNAME:dispatcher}
    dispatcher-password: ${DISPATCHER_PASSWORD:changeme}
  routing:
    # Self-hosted OSRM (docker-compose service `osrm`). The router is
    # optional: when it is disabled or unreachable, routing endpoints
    # answer 503 and the fleet map falls back to straight lines.
    enabled: ${ROUTING_ENABLED:true}
    base-url: ${OSRM_BASE_URL:http://osrm:5000}
    profile: ${OSRM_PROFILE:driving}
    connect-timeout: ${OSRM_CONNECT_TIMEOUT:2s}
    read-timeout: ${OSRM_READ_TIMEOUT:5s}
    max-waypoints: ${OSRM_MAX_WAYPOINTS:25}
  optimization:
    # Google OR-Tools capacity-constrained routing. The solver runs on a
    # travel-time / distance matrix: OSRM road times when the router
    # answers, straight-line haversine distances (durations estimated at
    # the average speed below) when it does not. The matrix source is
    # always reported with the result.
    enabled: ${OPTIMIZATION_ENABLED:true}
    solver-time-limit: ${OPTIMIZATION_SOLVER_TIME_LIMIT:5s}
    max-orders: ${OPTIMIZATION_MAX_ORDERS:50}
    max-vehicles: ${OPTIMIZATION_MAX_VEHICLES:10}
    straight-line-speed-kmh: ${OPTIMIZATION_STRAIGHT_LINE_SPEED_KMH:40}
  tracking:
    # Simulated GPS: moves ON_ROUTE vehicles along their assigned stops.
    # Switch off when real GPS feeds arrive; the map then shows only
    # vehicles with a stored position.
    enabled: ${TRACKING_ENABLED:true}
    tick-millis: ${TRACKING_TICK_MILLIS:5000}
    default-speed-kmh: ${TRACKING_SPEED_KMH:40}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Local development only: restrict this before any shared deployment.
      show-details: always

logging:
  level:
    com.routemind: INFO
    org.flywaydb: INFO
